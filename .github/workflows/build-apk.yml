
name: Build JoJoLife 0.8.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o JoJoLife-0.8.0-Android-Studio.zip -d .

      - name: Build APK
        working-directory: JoJoLife072
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoJoLife-0.8.0-debug-apk
          path: JoJoLife072/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
